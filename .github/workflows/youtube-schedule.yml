# Calls the site's protected scheduled endpoints (plan D10). Needs two repository secrets:
# SITE_URL (for example https://meeem-app.vercel.app, without a trailing slash) and CRON_SECRET,
# the same value as the site's CRON_SECRET environment variable.
name: YouTube schedule

on:
  schedule:
    # Hourly: new videos from followed channels and playlists.
    - cron: "7 * * * *"
    # Daily: refreshes stored YouTube data within its 30-day limit.
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [sources-check, youtube-refresh]
        default: sources-check

permissions: {}

concurrency:
  group: youtube-schedule-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.schedule == '37 3 * * *' && 'youtube-refresh' || inputs.job || 'sources-check' }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the SITE_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/$JOB")
          cat response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::$JOB answered HTTP $status"
            exit 1
          fi
